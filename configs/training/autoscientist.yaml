# AutoScientist series constants. These are the controlled-experiment constants:
# every finetune condition in a series MUST share these values (AGENTS.md).
# Changing any of them = a new experiment series (new config file), not an edit.
# Consumed by pipeline/training/ (Hydra); per-condition values (dataset_id, run name)
# come from CLI overrides.

# Base model id from client.training_models.list(); null = AutoScientist auto-selects
# (avoid null for controlled series: the resolved model must be identical across conditions).
model: null                 # e.g. meta-llama/Llama-3.2-3B-Instruct for the sub-3B RQ

data_format: instruction    # instruction | chat
max_iterations: 3
target_win_rate: 0.7

# Synthetic rows appended before training (0 = none); count toward effective dataset size
augmentation_domain_rows: 0
augmentation_general_rows: 0

# Hyperparameter overrides are NOT advised; AutoScientist derives them per model/dataset.
# Inspect derived values with client.autoscientist.recommend_hyperparams(...).
# If you must pin LoRA: lora_r 1..64, lora_alpha exactly 1x or 2x lora_r,
# and never set batch_size (the "max" default is the only valid choice).
hyperparams: null

# Publishing
hub_model_id: null          # sanggusti/{domain}-{language}-finetuned

hydra:
  run:
    dir: .
  output_subdir: null
