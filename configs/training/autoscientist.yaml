# Per-run override schema for pipeline/training/autoscientist_finetune.py (planned module).
# The controlled-experiment constants do NOT live here: they come from the series file
# (configs/series/{series}.yaml, block `autoscientist`) and are identical for every run of a
# series. This file only names the per-run values the planner passes on the command line.
# Consumed as: uv run python -m pipeline.training.autoscientist_finetune series=... benchmark=...
#              base=primary language=jv replicate=1 hub_model_id=...

series: s01_language_medium   # series whose constants apply
benchmark: null               # registry name under configs/benchmark/
base: primary                 # base model role in the series (primary | contrast)
language: null                # train language code, or `all` for the pooled set
replicate: 1                  # fresh run with a new idempotency_key; the SDK exposes no seed

# Derived by the planner from the series naming templates; never composed by hand
train_dataset: null           # sanggusti/{benchmark}-{language}, split train, uploaded raw
hub_model_id: null            # sanggusti/{benchmark}-{train_language}-{series}-{base}-r{replicate}

# Base model ids come from client.autoscientist.list_models(); training_models.list() is deprecated.
# hyperparams are copied verbatim from the series file (one recommend_hyperparams call on the
# English gsm8k dataset of the primary base). After the run, best_hyperparams must equal the
# submission or the run is rejected.

hydra:
  run:
    dir: .
  output_subdir: null
