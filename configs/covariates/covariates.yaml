# Covariate scripts (Phase 0): fertility, bits per byte, lexical similarity,
# reference audit. One config drives all four modules under pipeline/covariates/.
# HF dataset ids and columns are verified in the Phase 0 smoke run.

series: s01_language_medium
languages: null            # null = all series languages; or a list like [en, id, jv]
output_dir: data/covariates

flores_dataset: facebook/flores
flores_split: devtest
nusax_csv_url: https://raw.githubusercontent.com/IndoNLP/nusax/main/datasets/mt/test.csv
# The indonlp/NusaX-* Hub repos are legacy scripts unloadable under datasets>=4,
# so similarity reads the published CSVs directly (12 parallel columns, verified).
nusax_columns:             # series code -> CSV column
  en: english
  id: indonesian
  jv: javanese
  su: sundanese
  min: minangkabau
  ace: acehnese
  ban: balinese
  bjn: banjarese
  bug: buginese
flores_tarball_url: https://dl.fbaipublicfiles.com/nllb/flores200_dataset.tar.gz
# Fallback when facebook/flores Hub access is gated; layout verified 2026-11-23:
# flores200_dataset/{dev,devtest}/{code}.{dev,devtest}, 1012 lines each.
heldout_items: null        # optional JSONL of project items ({id, language, text}) for BPB pairing

# Seed marker lists for the Javanese register heuristic (reference_audit.py).
# Documented approximation, extendable without code changes.
ngoko_markers:
  - aku
  - kowe
  - dheweke
  - iki
  - kuwi
  - arep
  - ora
krama_markers:
  - kula
  - panjenengan
  - piyambakipun
  - menika
  - badhe
  - mboten

wandb:
  project: qc_native_preference_tuning
  run_prefix: datagen-covariates

hydra:
  run:
    dir: .
  output_subdir: null
