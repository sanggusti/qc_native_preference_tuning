name: medqa
domain: medical
inspect_reference: inspect_evals/medqa
scorer: choice
scorer_language_agnostic: true
license: research use; see source repository
instruction_en: |-
  Answer the following multiple choice question. The last line of your response should be of the following format: 'ANSWER: $LETTER' (without quotes) where LETTER is one of {letters}.

  Question:
  {question}

  Options:
  {choices}

eval_source:
  hf_repo: bigbio/med_qa
  config: med_qa_en_4options_bigbio_qa   # 4-option rows; the default config has 5
  split: test                # 1,273 USMLE-style 4-option items
  fields:
    question: question
    choices: choices
    answer: answer           # list with the correct option text; target letter derived by index

train_source:
  hf_repo: bigbio/med_qa
  config: med_qa_en_4options_bigbio_qa   # 4-option rows; the default config has 5
  split: train               # 10,178 items; a fixed seeded 1,000-item subset is used (ids published)
  fields:
    question: question
    choices: choices
    answer: answer
  min_rows: 1000

translate:
  fields: [question, choices]
  preserve:
    - option order and the index of the correct option
    - drug names, units, laboratory values and standard abbreviations
    - the translated correct option must be byte-identical to one translated choice
  blueprint: >-
    Translate ONLY the text below into {language}. Output nothing but the translation. Keep
    the options in the same order and do not merge or drop any option. If the text is a
    JSON array, output a JSON array with the same number of elements and nothing else. Keep drug names, units,
    laboratory values and standard abbreviations unchanged. Be formal and terminologically
    precise in the register given next; where the language has no established medical term,
    keep the Indonesian or Latin term and mark nothing else. {register_instruction}
  prompt_template_key: multiple_choice_instruction   # translated once per language; keeps the literal "ANSWER: $LETTER"
  variants:
    rt: back-translation of the {language} test split into English by the same translator
    nllb: NLLB-200 translation of the test split, second opinion on translation quality
