name: mgsm
domain: math
inspect_reference: inspect_evals/mgsm
scorer: numeric_match
scorer_language_agnostic: true

eval_source:
  hf_repo: juletxara/mgsm
  config: en
  split: test                # 250 human-translated GSM8K items; MGSM train has only 8
  fields:
    question: question
    answer: answer           # worked solution ending in the final number
    answer_number: answer_number

train_source:
  hf_repo: openai/gsm8k
  config: main
  split: train               # 7,473 items; MGSM test items are drawn from GSM8K test, so disjoint
  fields:
    question: question
    answer: answer           # reasoning then "#### <number>"
  min_rows: 1000

translate:
  fields: [question, answer]
  preserve: [all numbers, arithmetic expressions, the "####" delimiter, the final numeric answer]
  blueprint: >-
    Translate the question and the worked solution into {language}. Preserve every number,
    arithmetic expression, currency symbol and the final answer exactly. Keep the same
    reasoning steps in the same order. Do not add explanations.
  prompt_template_key: mgsm_cot_instruction   # "Solve this math problem ... Answer:" line
