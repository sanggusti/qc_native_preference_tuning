[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qc_native_preference_tuning"
version = "0.2.0"
description = "Evaluate finetuned LLMs on Indonesian low-resource language tasks using Inspect AI and Adaption"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "adaption",
    "inspect-ai",
    "datasets>=2.19.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "hydra-core>=1.3.2",
    "python-dotenv>=1.0.0",
    "scipy>=1.15.3",
    "statsmodels>=0.15.0",
    "matplotlib>=3.10.9",
    "wandb>=0.29.0",
    "weave>=0.54.1",
    "fasttext>=0.9.3",
]

[project.optional-dependencies]
training = [
    "torch>=2.3.0",
    "transformers>=4.40.0",
    "trl>=0.9.0",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "wandb>=0.17.0",
]
modal = ["modal>=0.62.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["configs*", "pipeline*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE", "B"]
ignore = ["E501"]
